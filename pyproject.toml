[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-relay"
version = "2.0.0"
description = "Research-Grounded Multi-Stage LLM Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=2.1.0",
    "httpx>=0.28.0",
    "groq>=1.7.0",
    "pydantic>=2.10.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.6.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
